Description: TCA - Generate and serve certificate images and SSR

Parameters:
  Stage:
    Type: String
    Description: The Environment/Stage for which to create the stack

  ImageStoreDomain:
    Type: String
    Description: TCA Generate Certificate Image Store Domain
    AllowedValues:
      - topcoder.com
      - topcoder-dev.com

Conditions:
  IsProd: !Equals [!Ref ImageStoreDomain, topcoder.com]

Mappings:
  DomainMap:
    topcoder.com:
      CertArn: arn:aws:acm:us-east-1:409275337247:certificate/8cabe19d-6559-41c6-8dfb-66f8080d27d4
      HostedZoneId: Z1B7U7QS3AAI1X
      RoleArn: arn:aws:iam::409275337247:role/learning-paths-v5-container-role

    topcoder-dev.com:
      CertArn: arn:aws:acm:us-east-1:811668436784:certificate/8e56f24a-1eaf-4289-8c21-db2c0761ecf4
      HostedZoneId: Z2CIRG3R0ZSGFQ
      RoleArn: arn:aws:iam::811668436784:role/learning-paths-v5-container-role

Resources:
  TCACertificateImageStoreKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "Encrypts TCA certificate image resources for ${Stage}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCertificateImageGenerator
            Effect: Allow
            Principal:
              AWS: !FindInMap
                - DomainMap
                - !Ref ImageStoreDomain
                - RoleArn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: "*"
          - Sid: AllowCloudFrontSSEKMS
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                "AWS:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
          - Sid: AllowCertificateImageQueues
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                "AWS:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:tca-certificate-generator-sqs-*"

  TCAGenerateCertificateQueueDeadLetter:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    Properties:
      KmsMasterKeyId: !GetAtt TCACertificateImageStoreKey.Arn
      QueueName: !Sub "tca-certificate-generator-sqs-dead-letter-${Stage}"

  TCAGenerateCertificateQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    Properties:
      KmsMasterKeyId: !GetAtt TCACertificateImageStoreKey.Arn
      QueueName: !Sub "tca-certificate-generator-sqs-${Stage}"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TCAGenerateCertificateQueueDeadLetter.Arn
        maxReceiveCount: 3

  TCACertificateImageStore:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      AccessControl: Private
      BucketName: !Sub "tca-certificate-generator-s3-${Stage}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt TCACertificateImageStoreKey.Arn
              SSEAlgorithm: aws:kms
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TCACertificateImageStoreOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Access to the private TCA certificate image bucket
        Name: !Sub "tca-certificate-images-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  TCACertificateImageStoreBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref TCACertificateImageStore
      PolicyDocument:
        Id: TCACertificateImageStoreBucketPolicy
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "${TCACertificateImageStore.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${TCAGenerateCertificateCdn}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TCACertificateImageStore.Arn
              - !Sub "${TCACertificateImageStore.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  TCAGenerateCertificateWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      DefaultAction:
        Allow: {}
      Description: !Sub "Protects the TCA certificate image distribution for ${Stage}"
      Name: !Sub "tca-certificate-images-${Stage}"
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          Priority: 0
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesCommonRuleSet
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "tca-certificate-images-common-${Stage}"
            SampledRequestsEnabled: true
      Scope: CLOUDFRONT
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "tca-certificate-images-${Stage}"
        SampledRequestsEnabled: true

  TCAGenerateCertificateCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !GetAtt TCAGenerateCertificateWebAcl.Arn
        Aliases:
          - !If [
              IsProd,
              !Sub "tca.${ImageStoreDomain}",
              !Sub "tca-${Stage}.${ImageStoreDomain}",
            ]
        Origins:
          - Id: CertificateImageS3Origin
            DomainName: !GetAtt TCACertificateImageStore.RegionalDomainName
            OriginAccessControlId: !Ref TCACertificateImageStoreOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: CertificateImageS3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          AcmCertificateArn: !FindInMap
            - DomainMap
            - !Ref ImageStoreDomain
            - CertArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  TCAGenerateCertificateRoute:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !FindInMap
        - DomainMap
        - !Ref ImageStoreDomain
        - HostedZoneId
      Name:
        !If [
          IsProd,
          !Sub "tca.${ImageStoreDomain}",
          !Sub "tca-${Stage}.${ImageStoreDomain}",
        ]
      Type: A
      AliasTarget:
        # hard-coded zone id for all cloudfront routes
        # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-route53-aliastarget.html#cfn-route53-aliastarget-hostedzoneid
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt TCAGenerateCertificateCdn.DomainName

  TCACertificateImageGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: >
          def handler(event, context):
              pass
      Description: Creates an image with a screenshot of a user's certificate
      FunctionName: !Sub "tca-certificate-generator-lambda-generate-image-${Stage}"
      Handler: handler.index
      Layers:
        - arn:aws:lambda:us-east-1:811668436784:layer:chromium:2
      MemorySize: 1600
      Role: !FindInMap
        - DomainMap
        - !Ref ImageStoreDomain
        - RoleArn
      Runtime: nodejs20.x
      Timeout: 30

  TCACertificateImageGeneratorFunctionEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      Enabled: true
      EventSourceArn: !GetAtt TCAGenerateCertificateQueue.Arn
      FunctionName:
        Ref: TCACertificateImageGeneratorFunction
